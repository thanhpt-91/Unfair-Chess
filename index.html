<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Play Stockfish 19, Stockfish 11, Fairy-Stockfish or Lozza with a superpower: sniper bishops, amazon queen, nightrider knights, leaping rooks, berserker pawns, Game of Life pawns or a Trojan Horse.">
<title>Unfair Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: board-first two-column table — board + player strips left, a "loadout" panel right; stacks on phones. */
:root {
  --bg: #e8ebee;
  --panel: #f8f9fa;
  --ink: #171b20;
  --muted: #5b6570;
  --line: #d3d8dd;
  --accent: #c8322b;
  --accent-soft: rgba(200, 50, 43, .12);
  --good: #2f7d4a;
  --sq-light: #f0d9b5;
  --sq-dark: #b58863;
  --ev-white: #f2f0ec;
  --ev-black: #3a3734;
  --hl-last: rgba(155, 199, 0, .42);
  --hl-sel: rgba(20, 85, 30, .5);
  --dot: rgba(20, 85, 30, .45);
  --check: rgba(220, 30, 20, .85);
  --shadow: 0 1px 2px rgba(20, 25, 30, .08), 0 8px 28px rgba(20, 25, 30, .10);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --panel: #1c2026; --ink: #e9ecef; --muted: #98a2ad; --line: #2c323a;
    --accent: #ff5d54; --accent-soft: rgba(255, 93, 84, .14); --good: #6cc48a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --panel: #1c2026; --ink: #e9ecef; --muted: #98a2ad; --line: #2c323a;
  --accent: #ff5d54; --accent-soft: rgba(255, 93, 84, .14); --good: #6cc48a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 32px rgba(0,0,0,.35);
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 32px;
  display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start;
}
@media (max-width: 880px) { .app { grid-template-columns: minmax(0, 1fr); gap: 20px; } }

/* ---- board column ---- */
.table { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
.strip {
  width: var(--bw); display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 34px;
}
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .name { font-weight: 600; white-space: nowrap; }
.elo { font-family: var(--f-mono); font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--panel); white-space: nowrap; font-variant-numeric: tabular-nums; }
.elo.max { background: var(--accent); color: #fff; }
.who .tag { font-family: var(--f-mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.power-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 4px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.power-chip svg { width: 22px; height: 22px; flex: none; }
.picon .a { stroke: var(--accent); }
.caps { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
.caps img { width: 18px; height: 18px; margin-left: -5px; }
.caps .diff { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
.dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot-live.on { background: var(--good); box-shadow: 0 0 0 4px color-mix(in srgb, var(--good) 22%, transparent); }

.table { --bw: min(100%, 640px, max(300px, calc(100dvh - 150px))); }
.board-row { width: var(--bw); max-width: 100%; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
.board-row.no-eval { grid-template-columns: minmax(0, 1fr); }
.evalbar { position: relative; border-radius: 4px; overflow: hidden; background: var(--ev-black); box-shadow: var(--shadow); }
.evalbar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 50%; background: var(--ev-white); transition: height .45s cubic-bezier(.3,.7,.3,1); }
.evalbar.flip .fill { bottom: auto; top: 0; }
.evalbar .num { position: absolute; left: 0; right: 0; text-align: center; font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: -.03em; line-height: 1; z-index: 1; }
.evalbar .num.at-bottom { bottom: 5px; } .evalbar .num.at-top { top: 5px; }
.evalbar .num.on-white { color: var(--ev-black); } .evalbar .num.on-black { color: var(--ev-white); }
.evalbar .mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(200, 50, 43, .7); z-index: 1; }
.switch { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: transparent; cursor: pointer; width: 100%; font-size: 13px; font-weight: 500; }
.switch .knob { width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .2s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch[aria-checked="true"] .knob { background: var(--accent); }
.switch[aria-checked="true"] .knob::after { transform: translateX(12px); }
.board-wrap { width: 100%; aspect-ratio: 1; position: relative; border-radius: 4px; overflow: hidden; box-shadow: var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none; }
.squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
.sq { position: relative; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last::after, .sq.sel::after { content: ""; position: absolute; inset: 0; }
.sq.last::after { background: var(--hl-last); }
.sq.sel::after { background: var(--hl-sel); }
.sq.check { background-image: radial-gradient(circle, var(--check) 0%, rgba(220,30,20,.45) 35%, rgba(220,30,20,0) 72%); }
.coord { position: absolute; font-family: var(--f-body); font-weight: 600; font-size: clamp(9px, 1.5vw, 12px); pointer-events: none; z-index: 1; }
.coord.rank { top: 3px; left: 4px; } .coord.file { bottom: 2px; right: 4px; }
.sq.l .coord { color: var(--sq-dark); } .sq.d .coord { color: var(--sq-light); }
.mark { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.mark.move::before { content: ""; position: absolute; inset: 37%; border-radius: 50%; background: var(--dot); }
.mark.cap::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(transparent 0 79%, var(--dot) 80%); }
.mark.shot { background:
  linear-gradient(var(--accent), var(--accent)) center/2px 70% no-repeat,
  linear-gradient(var(--accent), var(--accent)) center/70% 2px no-repeat; opacity: .9; }
.mark.shot::before { content: ""; position: absolute; inset: 18%; border-radius: 50%; border: 2.5px solid var(--accent); }
.mark.jump::after { content: "↷"; position: absolute; right: 6%; top: 2%; font-size: clamp(9px, 1.4vw, 13px); font-weight: 700; color: rgba(20,85,30,.85); }
.preview { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.pv { position: absolute; width: 12.5%; height: 12.5%; }
.pv.born { background-size: 88% 88%; background-position: center; background-repeat: no-repeat; opacity: .6;
  box-shadow: inset 0 0 0 3px var(--good); background-color: rgba(47, 125, 74, .22); animation: pvPulse 1.4s ease-in-out infinite; }
.pv.died { background: rgba(200, 50, 43, .42); box-shadow: inset 0 0 0 3px var(--accent); animation: pvPulse 1.4s ease-in-out infinite; }
.pv.died::before, .pv.died::after { content: ""; position: absolute; left: 14%; right: 14%; top: 50%; height: 6px; margin-top: -3px; background: var(--accent); border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75); }
.pv.died::before { transform: rotate(45deg); } .pv.died::after { transform: rotate(-45deg); }
.pv.maybe { animation: none; }
.pv.born.maybe { opacity: .3; box-shadow: inset 0 0 0 2px var(--good); background-color: transparent; }
.pv.died.maybe { background: rgba(200, 50, 43, .16); box-shadow: inset 0 0 0 2px rgba(200, 50, 43, .6); }
.pv.died.maybe::before, .pv.died.maybe::after { opacity: .45; }
@keyframes pvPulse { 50% { filter: brightness(1.25); } }
.life-hint { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.life-hint i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.life-hint .k-d { background: rgba(200, 50, 43, .42); box-shadow: inset 0 0 0 2px var(--accent); }
.life-hint .k-b { background: rgba(47, 125, 74, .22); box-shadow: inset 0 0 0 2px var(--good); }
@media (prefers-reduced-motion: reduce) { .pv { animation: none !important; } }
.update-toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-radius: 12px; background: var(--ink); color: var(--panel);
  box-shadow: var(--shadow); font-size: 14px; max-width: calc(100% - 32px); }
.update-toast button { border: 0; border-radius: 8px; padding: 7px 12px; font-weight: 600; background: var(--accent); color: #fff; cursor: pointer; }
.display-col { display: grid; gap: 6px; }
.sq.hover::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 4px rgba(255,255,255,.65); }

.pieces { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
.pc { position: absolute; width: 12.5%; height: 12.5%; background-size: 100% 100%; will-change: transform; }
.pc.anim { transition: transform .18s cubic-bezier(.3,.7,.3,1); }
.pc.drag { z-index: 10; filter: drop-shadow(0 6px 8px rgba(0,0,0,.35)); transition: none; }
.pc.ghost { animation: hit .55s ease-out forwards; }
.pc.born { animation: born .5s .2s both cubic-bezier(.3,1.5,.5,1); }
@keyframes born { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes hit { 0% { opacity: 1; transform: scale(1); filter: brightness(1.6); } 100% { opacity: 0; transform: scale(.4) rotate(18deg); } }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.fx line { stroke: var(--accent); stroke-width: .06; stroke-linecap: round; animation: tracer .5s ease-out forwards; }
.fx circle { fill: none; stroke: var(--accent); stroke-width: .05; animation: burst .5s ease-out forwards; }
@keyframes tracer { 0% { stroke-dasharray: 0 20; opacity: 1; } 40% { stroke-dasharray: 20 0; opacity: 1; } 100% { stroke-dasharray: 20 0; opacity: 0; } }
@keyframes burst { 0% { r: .05; opacity: 1; } 100% { r: .6; opacity: 0; } }

.promo { position: absolute; inset: 0; z-index: 20; background: rgba(10, 12, 15, .45); display: grid; place-items: center; }
.promo-box { display: flex; gap: 6px; background: var(--panel); padding: 8px; border-radius: 10px; box-shadow: var(--shadow); }
.promo-box button { width: clamp(52px, 10vw, 72px); aspect-ratio: 1; border: 1px solid var(--line); border-radius: 8px; background: var(--bg) center/86% no-repeat; cursor: pointer; }
.promo-box button:hover { border-color: var(--accent); }

.result { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(10, 12, 15, .5); }
.result-card { background: var(--panel); color: var(--ink); border-radius: 12px; padding: 22px 26px; text-align: center; box-shadow: var(--shadow); max-width: 82%; display: grid; gap: 10px; justify-items: center; }
.result-card h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.01em; text-wrap: balance; }
.result-card p { margin: 0; color: var(--muted); }

/* ---- panel ---- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -.02em; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; }
.label em { font-style: normal; letter-spacing: 0; text-transform: none; color: var(--accent); font-weight: 500; }
.powers { display: grid; gap: 6px; }
.power {
  display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left;
  padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: transparent; cursor: pointer;
}
.power:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.power[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.power svg { width: 36px; height: 36px; color: var(--ink); }
.power b { display: block; font-weight: 600; font-size: 14px; }
.power small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; }
.seg { display: grid; grid-template-columns: repeat(var(--n), 1fr); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { font-variant-numeric: tabular-nums; border: 0; background: transparent; padding: 8px 4px; cursor: pointer; font-size: 13px; font-weight: 500; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.actions { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 9px; padding: 9px 12px; cursor: pointer; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:hover { filter: brightness(1.05); border-color: var(--muted); }
.btn.primary:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.status-box { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.status { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-height: 22px; }
.status .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pending { font-size: 12.5px; color: var(--accent); }
.moves { font-family: var(--f-mono); font-size: 13px; max-height: 190px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 8px;
  display: grid; grid-template-columns: 3ch 1fr 1fr; column-gap: 10px; row-gap: 2px; font-variant-numeric: tabular-nums; }
.moves .n { color: var(--muted); }
.moves .shot { color: var(--accent); font-weight: 600; }
.moves .life { color: var(--accent); font-size: 11px; margin-left: 4px; }
.moves .empty { grid-column: 1 / -1; color: var(--muted); font-family: var(--f-body); }
.engine-note { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .pc.anim { transition: none; } .fx line, .fx circle, .pc.ghost, .pc.born { animation-duration: .01s; animation-delay: 0s; } }
</style>
<style>body{margin:0}</style>
</head>
<body>
<div class="app">
  <section class="table" aria-label="Board">
    <div class="strip" id="topStrip"></div>
    <div class="board-row" id="boardRow">
      <div class="evalbar" id="evalbar" role="meter" aria-label="Evaluation" aria-valuemin="0" aria-valuemax="100">
        <div class="fill"></div><div class="mid"></div><span class="num"></span>
      </div>
      <div class="board-wrap" id="board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces"></div>
        <div class="preview" id="preview" aria-hidden="true"></div>
        <svg class="fx" id="fx" viewBox="0 0 8 8" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="strip" id="botStrip"></div>
  </section>

  <aside class="panel">
    <div class="brand">
      <h1>Unfair <span>Chess</span></h1>
      <p>You get one superpower. Stockfish plays by the normal rules.</p>
    </div>

    <div class="status-box">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="life-hint" id="lifeHint" hidden></div>
    </div>

    <div>
      <div class="label">Your power <em id="powerNote"></em></div>
      <div class="powers" id="powers"></div>
    </div>

    <div>
      <div class="label">Opponent engine</div>
      <div class="seg" id="engineSeg" style="--n:4"></div>
    </div>

    <div class="row2">
      <div>
        <div class="label">Play as</div>
        <div class="seg" id="colorSeg" style="--n:2"></div>
      </div>
      <div>
        <div class="label">Display</div>
        <div class="display-col">
          <button class="switch" type="button" role="switch" id="evalToggle" aria-checked="true"><span class="knob"></span>Eval bar</button>
          <button class="switch" type="button" role="switch" id="lifeToggle" aria-checked="false" title="Hover or drag to a square to see which pawns die and are born" hidden><span class="knob"></span>Life preview</button>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="newBtn" type="button">New game</button>
      <button class="btn" id="undoBtn" type="button">Undo</button>
      <button class="btn" id="resignBtn" type="button">Resign</button>
    </div>

    <div class="moves" id="moves"></div>
    <div class="engine-note" id="engineNote">Loading Stockfish…</div>
  </aside>
</div>

// ===== Rules core: standard chess + one-sided abilities =====
const FILES = 'abcdefgh';
const START_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const KN = [[1,2],[2,1],[2,-1],[1,-2],[-1,-2],[-2,-1],[-2,1],[-1,2]];
const DIAG = [[1,1],[1,-1],[-1,1],[-1,-1]];
const ORTH = [[1,0],[-1,0],[0,1],[0,-1]];
const KING = DIAG.concat(ORTH);

const sqName = i => FILES[i & 7] + ((i >> 3) + 1);
const colorOf = p => p ? (p === p.toUpperCase() ? 'w' : 'b') : null;
const typeOf = p => p.toLowerCase();
const onB = (f, r) => f >= 0 && f < 8 && r >= 0 && r < 8;
const idx = (f, r) => r * 8 + f;
const other = c => c === 'w' ? 'b' : 'w';

function parseFEN(fen) {
  const [pos, turn, cas, ep, half, full] = fen.split(' ');
  const b = new Array(64).fill(null);
  const rows = pos.split('/');
  for (let row = 0; row < 8; row++) {
    let f = 0;
    for (const ch of rows[row]) {
      if (/\d/.test(ch)) f += +ch;
      else { b[idx(f, 7 - row)] = ch; f++; }
    }
  }
  return {
    b, turn,
    castle: { K: cas.includes('K'), Q: cas.includes('Q'), k: cas.includes('k'), q: cas.includes('q') },
    ep: ep === '-' ? -1 : (ep.charCodeAt(0) - 97) + (+ep[1] - 1) * 8,
    half: +half || 0, full: +full || 1,
  };
}

function boardKey(s) {
  let out = '';
  for (let r = 7; r >= 0; r--) {
    let e = 0;
    for (let f = 0; f < 8; f++) {
      const p = s.b[idx(f, r)];
      if (!p) e++; else { if (e) { out += e; e = 0; } out += p; }
    }
    if (e) out += e;
    if (r) out += '/';
  }
  const c = s.castle;
  const cas = (c.K ? 'K' : '') + (c.Q ? 'Q' : '') + (c.k ? 'k' : '') + (c.q ? 'q' : '') || '-';
  return out + ' ' + s.turn + ' ' + cas + ' ' + (s.ep >= 0 ? sqName(s.ep) : '-');
}
const toFEN = s => boardKey(s) + ' ' + s.half + ' ' + s.full;

// Squares attacked by color `by`, using ability `ab` (null = standard chess)
function attackMap(b, by, ab) {
  const m = new Uint8Array(64);
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (!p || colorOf(p) !== by) continue;
    const t = typeOf(p), f = i & 7, r = i >> 3;
    const ray = (dirs, leap) => {
      for (const [df, dr] of dirs) {
        let x = f + df, y = r + dr, jumped = false;
        while (onB(x, y)) {
          const j = idx(x, y); m[j] = 1;
          if (b[j]) { if (leap && !jumped) jumped = true; else break; }
          x += df; y += dr;
        }
      }
    };
    const step = dirs => { for (const [df, dr] of dirs) if (onB(f + df, r + dr)) m[idx(f + df, r + dr)] = 1; };
    if (t === 'p') {
      const d = by === 'w' ? 1 : -1;
      step([[-1, d], [1, d]]);
      if (ab === 'berserker') step([[0, d]]);
    } else if (t === 'n') { ab === 'nightrider' ? ray(KN) : step(KN); }
    else if (t === 'b') ray(DIAG);
    else if (t === 'r') ray(ORTH, ab === 'leaping');
    else if (t === 'q') { ray(DIAG); ray(ORTH); if (ab === 'amazon') step(KN); }
    else if (t === 'k') step(KING);
  }
  return m;
}

function pseudoMoves(s, c, ab, oppAb) {
  const b = s.b, ms = [], enemy = other(c);
  for (let i = 0; i < 64; i++) {
    const p = b[i];
    if (!p || colorOf(p) !== c) continue;
    const t = typeOf(p), f = i & 7, r = i >> 3;
    const add = (to, extra) => {
      const tgt = b[to];
      if (tgt && typeOf(tgt) === 'k') return;
      ms.push(Object.assign({ from: i, to, piece: p, cap: tgt || null }, extra || {}));
    };
    const ray = (dirs, opts = {}) => {
      for (const [df, dr] of dirs) {
        let x = f + df, y = r + dr, jumped = false;
        while (onB(x, y)) {
          const j = idx(x, y), q = b[j];
          if (!q) add(j, jumped ? { jump: true } : null);
          else {
            if (colorOf(q) === enemy) add(j, Object.assign({}, opts.capExtra || {}, jumped ? { jump: true } : {}));
            if (opts.leap && !jumped) jumped = true; else break;
          }
          x += df; y += dr;
        }
      }
    };
    const step = dirs => {
      for (const [df, dr] of dirs) {
        if (!onB(f + df, r + dr)) continue;
        const j = idx(f + df, r + dr), q = b[j];
        if (!q || colorOf(q) === enemy) add(j);
      }
    };
    if (t === 'p') {
      const d = c === 'w' ? 1 : -1, start = c === 'w' ? 1 : 6, last = c === 'w' ? 7 : 0;
      const pushP = (to, extra) => {
        if ((to >> 3) === last) for (const pr of 'qrbn') add(to, Object.assign({ promo: pr }, extra || {}));
        else add(to, extra);
      };
      if (onB(f, r + d)) {
        const one = idx(f, r + d);
        if (!b[one]) {
          pushP(one);
          const two = idx(f, r + 2 * d);
          if (r === start && !b[two]) add(two, { double: true });
        } else if (ab === 'berserker' && colorOf(b[one]) === enemy) pushP(one, { straight: true });
      }
      for (const df of [-1, 1]) {
        if (!onB(f + df, r + d)) continue;
        const to = idx(f + df, r + d);
        if (b[to] && colorOf(b[to]) === enemy) pushP(to);
        else if (to === s.ep && !b[to]) ms.push({ from: i, to, piece: p, cap: c === 'w' ? 'p' : 'P', ep: true });
      }
    } else if (t === 'n') {
      ab === 'nightrider' ? ray(KN) : step(KN);
      if (ab === 'trojan') { const u = unloadSquares(b, i); if (u.length) ms.push({ from: i, to: i, piece: p, cap: null, unload: u }); }
    }
    else if (t === 'b') ray(DIAG, ab === 'sniper' ? { capExtra: { shot: true } } : {});
    else if (t === 'r') ray(ORTH, { leap: ab === 'leaping' });
    else if (t === 'q') { ray(DIAG); ray(ORTH); if (ab === 'amazon') step(KN); }
    else if (t === 'k') {
      step(KING);
      const home = c === 'w' ? 4 : 60;
      if (i === home) {
        const K = c === 'w' ? 'K' : 'k', Q = c === 'w' ? 'Q' : 'q', R = c === 'w' ? 'R' : 'r';
        let att = null;
        const safe = sqs => { att = att || attackMap(b, enemy, oppAb); return sqs.every(x => !att[x]); };
        if (s.castle[K] && b[home + 3] === R && !b[home + 1] && !b[home + 2] && safe([home, home + 1, home + 2]))
          ms.push({ from: home, to: home + 2, piece: p, cap: null, castle: 'K' });
        if (s.castle[Q] && b[home - 4] === R && !b[home - 1] && !b[home - 2] && !b[home - 3] && safe([home, home - 1, home - 2]))
          ms.push({ from: home, to: home - 2, piece: p, cap: null, castle: 'Q' });
      }
    }
  }
  return ms;
}

// Trojan Horse: the knight opens and fills its 3x3 block with pawns: its own square plus every
// empty neighbour. Pawns can't stand on ranks 1 and 8, so those squares are skipped (a knight on
// a back rank just disappears after unloading).
function unloadSquares(b, i) {
  const f = i & 7, r = i >> 3, out = [];
  for (let dr = -1; dr <= 1; dr++) for (let df = -1; df <= 1; df++) {
    const x = f + df, y = r + dr;
    if (!onB(x, y) || y === 0 || y === 7) continue;
    const j = idx(x, y);
    if (j === i || !b[j]) out.push(j);
  }
  return out;
}

function makeMove(s, m) {
  const b = s.b.slice(), c = s.turn, p = b[m.from];
  if (m.unload) {
    b[m.from] = null;
    for (const j of m.unload) b[j] = c === 'w' ? 'P' : 'p';
    return { b, turn: other(c), castle: Object.assign({}, s.castle), ep: -1, half: 0, full: c === 'b' ? s.full + 1 : s.full };
  }
  if (m.shot) b[m.to] = null;
  else {
    b[m.to] = m.promo ? (c === 'w' ? m.promo.toUpperCase() : m.promo) : p;
    b[m.from] = null;
    if (m.ep) b[m.to + (c === 'w' ? -8 : 8)] = null;
    if (m.castle === 'K') { b[m.from + 1] = b[m.from + 3]; b[m.from + 3] = null; }
    if (m.castle === 'Q') { b[m.from - 1] = b[m.from - 4]; b[m.from - 4] = null; }
  }
  const castle = Object.assign({}, s.castle);
  if (p === 'K') castle.K = castle.Q = false;
  if (p === 'k') castle.k = castle.q = false;
  for (const x of [m.from, m.to]) {
    if (x === 0) castle.Q = false; if (x === 7) castle.K = false;
    if (x === 56) castle.q = false; if (x === 63) castle.k = false;
  }
  return {
    b, turn: other(c), castle,
    ep: m.double ? (m.from + m.to) / 2 : -1,
    half: (typeOf(p) === 'p' || m.cap) ? 0 : s.half + 1,
    full: c === 'b' ? s.full + 1 : s.full,
  };
}

const kingSq = (b, c) => b.indexOf(c === 'w' ? 'K' : 'k');
function inCheck(s, c, oppAb) { return !!attackMap(s.b, other(c), oppAb)[kingSq(s.b, c)]; }

// Game of Life Pawns: one generation over the mover's own pawns only. Enemy pawns and all other
// pieces are obstacles (not cells, and no birth on them). A pawn with 2 or 3 friendly-pawn
// neighbours survives; an empty square with exactly 3 gets a new friendly pawn. No births on the
// back ranks, and the side may not exceed 8 pawns or 16 pieces (centre files are born first).
function lifeStep(b, c) {
  const P = c === 'w' ? 'P' : 'p';

    const capSq = m.ep ? m.to + (colorOf(m.piece) === 'w' ? -8 : 8) : m.to;
    const g = document.createElement('div');
    const { x, y } = posOf(capSq);
    g.className = 'pc ghost'; g.style.left = x * 12.5 + '%'; g.style.top = y * 12.5 + '%';
    g.style.backgroundImage = `url("${PIECES[m.cap]}")`;
    if (!m.shot) g.style.animationDelay = '.12s';
    piecesEl.appendChild(g); setTimeout(() => g.remove(), 800);
  }
  if (m.unload) {
    const g = document.createElement('div'), { x, y } = posOf(m.from);
    g.className = 'pc ghost'; g.style.left = x * 12.5 + '%'; g.style.top = y * 12.5 + '%';
    g.style.backgroundImage = `url("${PIECES[m.piece]}")`;
    piecesEl.appendChild(g); setTimeout(() => g.remove(), 800);
    m.unload.forEach((j, k) => { const el = piecesEl.querySelector(`.pc[data-sq="${j}"]`); if (el) { el.classList.add('born'); el.style.animationDelay = (0.15 + k * 0.05) + 's'; } });
    return;
  }
  const L = G.s.life;
  if (L) {
    for (const d of L.died) {
      const g = document.createElement('div'), { x, y } = posOf(d.sq);
      g.className = 'pc ghost'; g.style.left = x * 12.5 + '%'; g.style.top = y * 12.5 + '%';
      g.style.backgroundImage = `url("${PIECES[d.p]}")`; g.style.animationDelay = '.2s';
      piecesEl.appendChild(g); setTimeout(() => g.remove(), 1000);
    }
    for (const n of L.born) piecesEl.querySelector(`.pc[data-sq="${n.sq}"]`)?.classList.add('born');
  }
  if (m.shot) {
    const a = posOf(m.from), b = posOf(m.to);
    fxEl.innerHTML = `<line x1="${a.x + .5}" y1="${a.y + .5}" x2="${b.x + .5}" y2="${b.y + .5}"></line><circle cx="${b.x + .5}" cy="${b.y + .5}" r=".05"></circle>`;
    setTimeout(() => { fxEl.innerHTML = ''; }, 650);
    return;
  }
  if (reduce) return;
  const slide = (from, to) => {
    const el = piecesEl.querySelector(`.pc[data-sq="${to}"]:not(.ghost)`); if (!el) return;
    const a = posOf(from), b = posOf(to);
    el.style.transform = `translate(${(a.x - b.x) * 100}%, ${(a.y - b.y) * 100}%)`;
    el.getBoundingClientRect();
    el.classList.add('anim'); el.style.transform = '';
  };
  slide(m.from, m.to);
  if (m.castle === 'K') slide(m.from + 3, m.from + 1);
  if (m.castle === 'Q') slide(m.from - 4, m.from - 1);
}

function capturedBy(c) {
  // pieces of the opponent that are missing (promotion-aware enough for display)
  const start = { p: 8, n: 2, b: 2, r: 2, q: 1 };
  const opp = other(c), have = { p: 0, n: 0, b: 0, r: 0, q: 0 };
  for (const p of G.s.b) if (p && colorOf(p) === opp && typeOf(p) !== 'k') have[typeOf(p)]++;
  const out = [];
  for (const t of 'qrbnp') for (let k = 0; k < Math.max(0, start[t] - have[t]); k++) out.push(opp === 'w' ? t.toUpperCase() : t);
  return out;
}
function playingName() {
  const n = Engine.net;
  return n === 'lite' || n === 'full' ? 'Stockfish 19' : engineInfo(n || Engine.id).name;
}
function stripHTML(c) {
  const isHuman = c === G.human;
  const mat = evalMat(G.s.b, c);
  const caps = capturedBy(c).map(p => `<img src="${PIECES[p]}" alt="">`).join('');
  const thinking = !isHuman && G.thinking;
  const pw = powerOf(G.ability);
  const left = isHuman
    ? `<div class="who"><span class="dot-live ${G.s.turn === c && !G.over ? 'on' : ''}"></span><span class="name">You</span>
       <span class="power-chip">${powerIcon(pw.id)}${pw.name}</span></div>`
    : `<div class="who"><span class="dot-live ${thinking ? 'on' : ''}"></span><span class="name">${playingName()}</span><span class="elo max">${playingName() === 'Stockfish 19' ? 'Full strength · ~3600' : 'Full strength'}</span><span class="tag">${Engine.net === 'lite' ? 'lite net · ' : ''}normal rules</span></div>`;
  return left + `<div class="caps">${caps}${mat > 0 ? `<span class="diff">+${Math.round(mat / 100)}</span>` : ''}</div>`;
}
function renderStrips() {
  $('topStrip').innerHTML = stripHTML(other(G.human));
  $('botStrip').innerHTML = stripHTML(G.human);
}

function renderStatus() {
  const el = $('status');
  if (G.over) { el.textContent = resultText().title; return; }
  if (G.thinking) { el.innerHTML = '<span class="spin"></span>Stockfish is thinking…'; return; }
  const chk = inCheck(G.s, G.s.turn, oppAbFor(G.s.turn));
  if (G.s.turn === G.human) el.textContent = chk ? 'You are in check. Your move.' : 'Your move.';
  else el.textContent = 'Stockfish to move.';
  $('topStrip') && renderStrips();
}

function renderMoves() {
  const el = $('moves');
  if (!G.log.length) { el.innerHTML = '<span class="empty">Moves appear here. Sniper shots and other power moves are marked in red.</span>'; return; }
  let html = '', i = 0;
  const startBlack = G.log[0].color === 'b';
  let num = 1;
  if (startBlack) { html += `<span class="n">1.</span><span>…</span>`; }
  for (const e of G.log) {
    if (e.color === 'w') html += `<span class="n">${num}.</span>`;
    html += `<span class="${e.shot ? 'shot' : ''}">${e.san}${e.life ? `<span class="life" title="Life: ${e.life[0]} born, ${e.life[1]} died">+${e.life[0]} −${e.life[1]}</span>` : ''}</span>`;
    if (e.color === 'b') num++;
    i++;
  }
  el.innerHTML = html; el.scrollTop = el.scrollHeight;
}

function renderControls() {
  $('powers').innerHTML = POWERS.map(p => `
    <button class="power" type="button" id="pw-${p.id}" data-id="${p.id}" aria-pressed="${G.next.ability === p.id}">
      ${powerIcon(p.id)}<span><b>${p.name}</b><small>${p.rule}</small></span>
    </button>`).join('');
  $('colorSeg').innerHTML = [['w', 'White'], ['b', 'Black']].map(([c, n]) =>
    `<button type="button" id="col-${c}" data-c="${c}" aria-pressed="${G.next.human === c}">${n}</button>`).join('');
  $('engineSeg').innerHTML = ENGINE_LIST.map(e =>
    `<button type="button" id="eng-${e.id}" data-eng="${e.id}" aria-pressed="${Engine.id === e.id}" title="${e.name}: ${e.blurb}">${e.short}</button>`).join('');
  const pending = G.next.ability !== G.ability || G.next.human !== G.human || G.next.level !== G.level;
  $('powerNote').textContent = pending ? 'applies on New game' : '';
  $('undoBtn').disabled = !G.hist.length;
  $('resignBtn').disabled = !!G.over || !G.log.length;
}

function resultText() {
  const o = G.over;
  if (o.kind === 'mate') return o.winner === G.human
    ? { title: 'Checkmate. You win.', sub: `${powerOf(G.ability).name} got it done in ${Math.ceil(G.log.length / 2)} moves.` }
    : { title: 'Checkmate. Stockfish wins.', sub: 'Even with a superpower. Try a lower level or a different power.' };
  if (o.kind === 'resign') return { title: 'You resigned.', sub: 'Stockfish wins this one.' };
  if (o.kind === 'stalemate') return { title: 'Stalemate.', sub: 'The side to move has no legal moves. Draw.' };
  if (o.kind === 'fifty') return { title: 'Draw by 50-move rule.', sub: 'Fifty moves without a capture or pawn move.' };
  if (o.kind === 'repetition') return { title: 'Draw by repetition.', sub: 'The same position came up three times.' };
  return { title: 'Draw.', sub: 'Not enough material left to checkmate.' };
}
function renderResult() {
  boardEl.querySelector('.result')?.remove();
  if (!G.over) return;
  const t = resultText();
  const d = document.createElement('div');
  d.className = 'result';
  d.innerHTML = `<div class="result-card"><h2>${t.title}</h2><p>${t.sub}</p>
    <div style="display:flex;gap:8px"><button class="btn primary" type="button" id="againBtn">Play again</button>
    <button class="btn" type="button" id="viewBtn">View board</button></div></div>`;
  boardEl.appendChild(d);
  d.querySelector('#againBtn').onclick = () => newGame();
  d.querySelector('#viewBtn').onclick = () => d.remove();
}

function setEval(e) { G.ev = e; renderEval(); }
function renderEval() {
  const row = $('boardRow'), bar = $('evalbar'), sw = $('evalToggle');
  sw.setAttribute('aria-checked', String(G.showEval));
  const lt = $('lifeToggle');
  lt.hidden = G.ability !== 'life' && G.next.ability !== 'life';
  lt.setAttribute('aria-checked', String(G.showLife));
  bar.hidden = !G.showEval; row.classList.toggle('no-eval', !G.showEval);
  if (!G.showEval) return;
  const e = G.ev;
  let pct = 50, text = '0.0';   // pct = white's share of the bar
  if (e && e.mate !== undefined) {
    const whiteWins = e.winner ? e.winner === 'w' : e.mate > 0;
    pct = whiteWins ? 100 : 0;
    text = e.winner ? (whiteWins ? '1-0' : '0-1') : 'M' + Math.abs(e.mate);
  } else if (e) {
    pct = 50 + 50 * (2 / (1 + Math.exp(-0.00368 * e.cp)) - 1);
    pct = Math.max(4, Math.min(96, pct));
    text = (Math.abs(e.cp) / 100).toFixed(1);
  }
  const whiteAhead = pct >= 50;
  bar.classList.toggle('flip', flip());
  bar.querySelector('.fill').style.height = pct + '%';
  const num = bar.querySelector('.num');
  num.textContent = text;
  // label sits at the leading side's end of the bar
  const atBottom = whiteAhead !== flip();
  num.className = 'num ' + (atBottom ? 'at-bottom' : 'at-top') + ' ' + (whiteAhead ? 'on-white' : 'on-black');
  bar.setAttribute('aria-valuenow', Math.round(pct));
  bar.title = 'Stockfish evaluation (normal-chess rules, ignores your power)';
}
function setEngineNote() {
  const el = $('engineNote'), info = engineInfo(Engine.id);
  if (Engine.failed) { el.textContent = info.name + ' could not load here, so a simple built-in bot is playing instead.'; return; }
  if (!Engine.ready) { el.textContent = 'Loading ' + info.name + '…'; return; }
  let s = Engine.note ? Engine.note + ' ' : info.blurb + ' ';
  s += 'Runs in your browser at full strength. It only knows normal chess, but its top moves are checked against your power.';
  if (Engine.net === 'full') s += ' Full net loaded.';
  else if (Engine.net === 'lite' && Engine.fullFailed) s += ' Using the lite net (the full net is not available here).';
  else if (Engine.net === 'lite') s += ' Using the lite net while the full net downloads' + (Engine.fullPct != null ? ' (' + Math.round(Engine.fullPct * 100) + '%)' : '') + '.';
  el.textContent = s;
}

// ===== Input =====
let drag = null, lastTap = { key: '', t: 0 };
function sqFromPoint(cx, cy) {
  const r = boardEl.getBoundingClientRect();
  const x = Math.floor((cx - r.left) / r.width * 8), y = Math.floor((cy - r.top) / r.height * 8);
  if (x < 0 || x > 7 || y < 0 || y > 7) return -1;
  return sqAt(x, y);
}
function canAct() { return !G.over && !G.thinking && G.s.turn === G.human; }
function tryMove(from, to) {
  const ms = G.legal.filter(m => m.from === from && m.to === to);
  if (!ms.length) return false;
  if (ms.length > 1 && ms[0].promo) { askPromo(ms); return true; }
  play(ms[0]); return true;
}
function askPromo(ms) {
  const d = document.createElement('div');
  d.className = 'promo';
  const c = G.human;
  d.innerHTML = `<div class="promo-box" role="dialog" aria-label="Promote to">${'qrbn'.split('').map(t =>
    `<button type="button" data-t="${t}" aria-label="${{ q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight' }[t]}" style="background-image:url('${PIECES[c === 'w' ? t.toUpperCase() : t]}')"></button>`).join('')}</div>`;
  d.addEventListener('pointerdown', e => {
    e.stopPropagation();
    const b = e.target.closest('button');
    d.remove();
    if (b) play(ms.find(m => m.promo === b.dataset.t)); else { G.selected = -1; renderBoard(); }
  });
  boardEl.appendChild(d);
}
boardEl.addEventListener('pointerdown', e => {
  if (e.target.closest('.result, .promo')) return;
  const sq = sqFromPoint(e.clientX, e.clientY);
  if (sq < 0 || !canAct()) return;
  // Double-tap = two taps that both select the same knight of yours (not a move onto that square)
  const now = performance.now(), tapKey = sq + ':' + G.log.length;
  if (G.ability === 'trojan' && lastTap.key === tapKey && now - lastTap.t < 450) {
    const u = G.legal.find(m => m.unload && m.from === sq);
    lastTap = { key: '', t: 0 };
    if (u) { drag = null; play(u); return; }
  }
  if (G.selected >= 0 && G.selected !== sq && tryMove(G.selected, sq)) { lastTap = { key: '', t: 0 }; return; }
  const tapped = G.s.b[sq];
  lastTap = tapped && colorOf(tapped) === G.human && typeOf(tapped) === 'n' ? { key: tapKey, t: now } : { key: '', t: 0 };
  const p = G.s.b[sq];
  if (p && colorOf(p) === G.human) {
    const reselect = G.selected === sq;
    G.selected = sq; renderBoard();
    showLifePreview(sq, -1);
    const el = piecesEl.querySelector(`.pc[data-sq="${sq}"]`);
    drag = { from: sq, el, x0: e.clientX, y0: e.clientY, moved: false, reselect, over: -1 };
    boardEl.setPointerCapture(e.pointerId);
  } else { G.selected = -1; renderBoard(); }
});
const previewEl = $('preview');
let previewKey = '';
function showLifePreview(from, to) {
  const moves = from >= 0 ? G.legal.filter(x => x.from === from && (!x.promo || x.promo === 'q')) : [];
  const exact = moves.find(x => x.to === to);
  const key = from + '-' + (exact ? to : -1);
  if (key === previewKey) return;
  previewKey = key; previewEl.innerHTML = '';
  const hint = $('lifeHint');
  if (G.ability === 'trojan') {
    const isKnight = from >= 0 && G.s.b[from] && typeOf(G.s.b[from]) === 'n';
    const u = isKnight && G.legal.find(m => m.unload && m.from === from);
    if (u && !exact) {
      const P = G.human === 'w' ? 'P' : 'p';
      previewEl.innerHTML = u.unload.map(j => { const { x, y } = posOf(j); return `<div class="pv born" style="left:${x * 12.5}%;top:${y * 12.5}%;background-image:url('${PIECES[P]}')"></div>`; }).join('');
    }
    hint.textContent = !isKnight ? '' : u ? `Double-tap the knight to unload ${u.unload.length} pawn${u.unload.length > 1 ? 's' : ''}.` : 'No room to unload this knight here.';
    hint.hidden = !isKnight;
    return;
  }
  if (!G.showLife || G.ability !== 'life' || !moves.length) { hint.hidden = true; return; }
  // Exact result for the hovered square, otherwise a summary over every move this piece can make:
  // solid marks happen whichever square you pick, faint ones only for some squares.
  const set = exact ? [exact] : moves, n = set.length;
  const died = new Map(), born = new Map();
  for (const m of set) {
    const L = applyMove(G.s, m, 'life').life;
    if (!L) continue;
    for (const d of L.died) died.set(d.sq, (died.get(d.sq) || 0) + 1);
    for (const b of L.born) born.set(b.sq, (born.get(b.sq) || 0) + 1);
  }
  const P = G.human === 'w' ? 'P' : 'p';
  let html = '';
  for (const [sq, c] of died) { const { x, y } = posOf(sq); html += `<div class="pv died${c < n ? ' maybe' : ''}" style="left:${x * 12.5}%;top:${y * 12.5}%"></div>`; }
  for (const [sq, c] of born) { const { x, y } = posOf(sq); html += `<div class="pv born${c < n ? ' maybe' : ''}" style="left:${x * 12.5}%;top:${y * 12.5}%;background-image:url('${PIECES[P]}')"></div>`; }
  previewEl.innerHTML = html;
  const dAll = [...died.values()].filter(c => c === n).length, bAll = [...born.values()].filter(c => c === n).length;
  hint.innerHTML = `<span><i class="k-d"></i>${dAll} will die</span><span><i class="k-b"></i>${bAll} will be born</span>` +
    `<span>${exact ? 'Result of this move.' : 'Faint marks depend on where you move. Hover or drag to a square for the exact result.'}</span>`;
  hint.hidden = false;
}
function clearLifePreview() { previewKey = ''; previewEl.innerHTML = ''; const h = document.getElementById('lifeHint'); if (h) h.hidden = true; }
boardEl.addEventListener('pointerleave', () => { if (!drag && G.selected >= 0) showLifePreview(G.selected, -1); });
boardEl.addEventListener('pointermove', e => {
  if (!drag) {
    if (e.pointerType === 'mouse' && G.selected >= 0 && canAct()) showLifePreview(G.selected, sqFromPoint(e.clientX, e.clientY));
    return;
  }
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) < 5) return;
  drag.moved = true;
  drag.el.classList.add('drag');
  drag.el.style.transform = `translate(${dx}px, ${dy}px)`;
  const over = sqFromPoint(e.clientX, e.clientY);
  if (over !== drag.over) {
    squaresEl.querySelector('.hover')?.classList.remove('hover');
    if (over >= 0 && targetsOf(drag.from).some(m => m.to === over)) squaresEl.querySelector(`[data-sq="${over}"]`)?.classList.add('hover');
    showLifePreview(drag.from, over);
    drag.over = over;
  }
});
function endDrag(e) {
  if (!drag) return;
  const d = drag; drag = null;
  squaresEl.querySelector('.hover')?.classList.remove('hover');
  if (d.moved) {
    const to = sqFromPoint(e.clientX, e.clientY);
    d.el.classList.remove('drag'); d.el.style.transform = '';
    if (to >= 0 && to !== d.from && tryMove(d.from, to)) return;
  } else if (d.reselect) { G.selected = -1; renderBoard(); }
}
boardEl.addEventListener('pointerup', endDrag);
boardEl.addEventListener('pointercancel', endDrag);

document.querySelector('.panel').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const fresh = !G.log.length || G.over;
  if (b.dataset.id) { G.next.ability = b.dataset.id; setPowerHash(b.dataset.id); if (fresh) return newGame(); }
  else if (b.dataset.eng) {
    if (b.dataset.eng !== Engine.id) {
      try { localStorage.setItem('uc-engine', b.dataset.eng); } catch (err) {}
      G.thinking = false;
      Engine.start(b.dataset.eng);
      if (!G.over && G.s.turn !== G.human) askEngine();
    }
    return renderControls();
  }
  else if (b.dataset.c) { G.next.human = b.dataset.c; if (fresh) return newGame(); }
  else if (b.id === 'lifeToggle') {
    G.showLife = !G.showLife;
    try { localStorage.setItem('uc-life', G.showLife ? '1' : '0'); } catch (err) {}
    clearLifePreview();
    if (G.showLife && G.selected >= 0) showLifePreview(G.selected, -1);
    return renderEval();
  }
  else if (b.id === 'evalToggle') {
    G.showEval = !G.showEval;
    try { localStorage.setItem('uc-eval', G.showEval ? '1' : '0'); } catch (err) {}
    return renderEval();
  }
  else if (b.id === 'newBtn') return newGame();
  else if (b.id === 'undoBtn') return undo();
  else if (b.id === 'resignBtn') return resign();
  renderControls(); renderEval();
});

// ===== Boot =====
// Each power has its own link (#sniper, #amazon, #nightrider, #leaping, #berserker, #life),
// so refreshing the page starts a new game with the same power.
function hashPower() {
  const h = (location.hash || '').slice(1).toLowerCase();
  return POWERS.some(p => p.id === h) ? h : null;
}
function setPowerHash(id) {
  if (hashPower() === id) return;
  try { history.replaceState(null, '', '#' + id); } catch (e) { try { location.hash = id; } catch (e2) {} }
}
window.addEventListener('hashchange', () => {
  const id = hashPower();
  if (!id || (id === G.ability && id === G.next.ability)) return;
  G.next.ability = id; newGame();
});
// Offline cache (sw.js, only on the real site): engines are kept permanently and the page opens
// from cache instantly. When a newer version has been deployed, offer a one-click reload.
if ('serviceWorker' in navigator && /github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // The isolation headers only apply to pages the service worker serves, which starts with the
  // load after it installs. So once it takes control, reload straight away (saving any game).
  navigator.serviceWorker.addEventListener('controllerchange', () => reloadForIsolation());
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'uc-updated') $('updateToast').hidden = false;
  });
  $('updateBtn').addEventListener('click', () => location.reload());
}
const snapshotState = () => ({
  human: G.human, ability: G.ability, level: G.level, next: G.next,
  s: G.s, hist: G.hist, log: G.log, keys: G.keys, over: G.over, last: G.last, ev: G.ev,
});
// Reload once so the page comes back cross-origin isolated. Returns false when that isn't possible
// (already isolated, already tried this session, or no service worker in control).
function reloadForIsolation() {
  if (self.crossOriginIsolated || !navigator.serviceWorker || !navigator.serviceWorker.controller) return false;
  try {
    if (sessionStorage.getItem('uc-iso-tried')) return false;
    sessionStorage.setItem('uc-iso-tried', '1');
    if (G.log.length && !G.over) sessionStorage.setItem('uc-resume', JSON.stringify(snapshotState()));
  } catch (e) { return false; }
  location.reload();
  return true;
}
function boot(data) {
  let resume = null;
  try { resume = JSON.parse(sessionStorage.getItem('uc-resume') || 'null'); sessionStorage.removeItem('uc-resume'); } catch (e) {}
  const fromHash = hashPower();
  if (resume && resume.s) data = resume;
  else if (fromHash) { G.ability = G.next.ability = fromHash; data = null; }
  try { const v = localStorage.getItem('uc-eval'); if (v !== null) G.showEval = v === '1'; } catch (e) {}
  try { G.showLife = localStorage.getItem('uc-life') === '1'; } catch (e) {}
  try {
    if (data && data.s) {
      Object.assign(G, data, { thinking: false, selected: -1, level: 0 }); G.next.level = 0;
      G.legal = currentLegal(G.s); render();
      if (!G.over && G.s.turn !== G.human) askEngine();
    } else newGame();
  } catch (e) { newGame(); }
  setPowerHash(G.next.ability);
  try { const e = localStorage.getItem('uc-engine'); if (ENGINE_LIST.some(x => x.id === e)) Engine.id = e; } catch (err) {}
  renderControls();
  Engine.start();
}
window.claude?.hot?.snapshot?.(snapshotState);
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
